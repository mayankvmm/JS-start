<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | ka | Bhosda 3</title>
</head>
<body style="background-color: black; color:bisque">
    <ul class="language">
        <li>JS</li>
    </ul>
</body>
<script>
    function addLanguage(langName) {
        const li = document.createElement("li");
        li.innerHTML = `${langName}`;
        document.querySelector('.language').appendChild(li);
    }
    addLanguage('python');

    function optimalLanguage(langName) {
        const li = document.createElement("li");
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
    }
    optimalLanguage("typecsript");
    optimalLanguage("React");

    //Edit
    const secLang = document.querySelector("li:nth-child(2)");
    // secLang.innerHTML = "WatchMojo"
    const newLi = document.createElement('li');
    newLi.textContent = "WatchMojo";
    secLang.replaceWith(newLi);

    const firstLang = document.querySelector("li:first-child");
    firstLang.outerHTML = "<li>Bakchodi</li>"
    
    // Remove
    const lastLang = document.querySelector("li:last-child");
    lastLang.remove() 

</script>
</html>
